name: Auto Update Stock Dashboard

on:
  schedule:
    # 11:00 AM EDT (15:00 UTC) — fires 11AM Institutional Research report
    - cron: "0 15 * * 1-5"
    # 2:00 PM EDT (18:00 UTC) — fires 2PM Mid-Day Intelligence report
    - cron: "0 18 * * 1-5"
    # 3:00 PM EDT (19:00 UTC) — fires 3PM Pre-Close Institutional report
    - cron: "0 19 * * 1-5"
    # 4:00 PM EDT (20:00 UTC) — fires 4PM EOD Summary report
    - cron: "0 20 * * 1-5"
  workflow_dispatch:   # Allows manual run

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Hard Reset Workspace
        # Clean old cache/sessions to prevent Overquota errors
        run: |
          git clean -fdx
          rm -rf cache/ tb_cache/ __pycache__/ Output/
          mkdir -p docs/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Stock Report Script
        run: python Jan27_3_final.py
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ENABLE_EMAIL_REPORTS: ${{ secrets.ENABLE_EMAIL_REPORTS }}
          PYTHONUNBUFFERED: "1"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Take the new HTML files and put them in a 'waiting area' (stash)
          git add docs/
          git stash

          # 2. Now that the workspace is 'clean', we can sync with GitHub
          git pull origin main --rebase

          # 3. Bring the new HTML files back from the waiting area
          git stash pop || echo "No changes to restore"
          
          # 4. Clean up tracking for old/unwanted folders
          git rm -r --cached Output/ cache/ tb_cache/ __pycache__/ || echo "Already clean"
          
          # 5. Add the final files
          git add docs/
          git add Jan27_3_final.py

          # 6. Commit and Force Push
          git commit -m "Auto update dashboard: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push origin main --force
