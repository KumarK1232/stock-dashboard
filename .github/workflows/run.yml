name: Auto Update Stock Dashboard

on:
  schedule:
    - cron: "0 15 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "0 19 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Create Docs Folder
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          touch docs/.gitkeep

      - name: DEBUG Before Scanner
        run: |
          echo "===== BEFORE SCANNER ====="
          pwd
          ls -la
          ls -la docs || true

      - name: Run Scanner
        run: python Jan27_3_final.py
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ENABLE_EMAIL_REPORTS: ${{ secrets.ENABLE_EMAIL_REPORTS }}
          PYTHONUNBUFFERED: "1"

      - name: DEBUG After Scanner
        run: |
          echo "===== AFTER SCANNER ====="
          ls -la
          ls -la docs || true
          echo "===== DOCS FILES ====="
          find docs -type f || true

      - name: Commit Dashboard Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          git status

          git commit -m "Auto update dashboard" || echo "No changes"

          git push
